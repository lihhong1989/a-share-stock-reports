let currentWindow=60;
function drawChart(win=currentWindow){currentWindow=win;const canvas=document.getElementById("chart"),wrap=canvas.parentElement,dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)),W=Math.max(320,wrap.clientWidth),H=canvas.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;const x=canvas.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);const all=arr(R.daily),start=win?Math.max(0,all.length-win):0,data=all.slice(start);if(!data.length){x.fillStyle="#8d9aae";x.fillText("无可用日线数据",20,30);return}const chipW=W<600?78:135,left=W<600?38:54,right=chipW+14,top=25,priceBottom=H*.76,volTop=H*.80,bottom=H-28,plotW=W-left-right,plotH=priceBottom-top;const high=Math.max(...data.map(d=>d.high)),low=Math.min(...data.map(d=>d.low)),pad=(high-low||1)*.08,pmax=high+pad,pmin=low-pad,px=p=>top+(pmax-p)/(pmax-pmin)*plotH,barW=Math.max(2,plotW/data.length*.62),step=plotW/data.length,xi=i=>left+step*(i+.5),maxVol=Math.max(...data.map(d=>d.volume||0),1);x.strokeStyle="#18263a";x.fillStyle="#7f8da2";x.font="11px system-ui";for(let i=0;i<=5;i++){const y=top+plotH*i/5;x.beginPath();x.moveTo(left,y);x.lineTo(W-right,y);x.stroke();const p=pmax-(pmax-pmin)*i/5;x.fillText(p.toFixed(2),4,y+4)}for(let i=0;i<5;i++){const idx=Math.min(data.length-1,Math.round(i*(data.length-1)/4)),xx=xi(idx);x.fillText(data[idx].date.slice(5),Math.max(left,xx-18),H-8)}
const series=t.series||{};[["ma5","#f4d264"],["ma10","#ee79bd"],["ma20","#518fff"],["ma60","#a878ff"]].forEach(([key,color])=>{const vals=arr(series[key]).slice(start);x.strokeStyle=color;x.lineWidth=1.3;x.beginPath();let begun=false;vals.forEach((v,i)=>{if(v==null)return;const xx=xi(i),yy=px(v);begun?x.lineTo(xx,yy):x.moveTo(xx,yy);begun=true});x.stroke()});
data.forEach((d,i)=>{const up=d.close>=d.open,color=up?"#f15b59":"#24bd84",xx=xi(i);x.strokeStyle=color;x.fillStyle=color;x.beginPath();x.moveTo(xx,px(d.high));x.lineTo(xx,px(d.low));x.stroke();const y1=px(Math.max(d.open,d.close)),y2=px(Math.min(d.open,d.close));x.fillRect(xx-barW/2,y1,barW,Math.max(1,y2-y1));const vh=(d.volume||0)/maxVol*(bottom-volTop);x.globalAlpha=.58;x.fillRect(xx-barW/2,bottom-vh,barW,vh);x.globalAlpha=1});
const dist=arr(c.distribution).filter(z=>z.price>=pmin&&z.price<=pmax),maxWeight=Math.max(...dist.map(z=>z.weight||0),1e-8),chipX=W-chipW-6;x.fillStyle="#8290a4";x.fillText("估算筹码",chipX,16);dist.forEach(z=>{const y=px(z.price),w=(z.weight/maxWeight)*(chipW-22);x.fillStyle=z.price<=q.close?"rgba(36,189,132,.56)":"rgba(241,91,89,.52)";x.fillRect(W-8-w,y-1,Math.max(1,w),2)});if(q.close){x.strokeStyle="#37d6c8";x.setLineDash([5,4]);x.beginPath();x.moveTo(left,px(q.close));x.lineTo(W-8,px(q.close));x.stroke();x.setLineDash([])}canvas._chart={data,start,left,right,top,priceBottom,plotW,step,xi,px,pmin,pmax};}
function wire(){
 document.querySelectorAll(".win").forEach(button=>{
  button.onclick=()=>{
   document.querySelectorAll(".win").forEach(item=>item.classList.remove("active"));
   button.classList.add("active");
   drawChart(Number(button.dataset.win));
  };
 });
 window.addEventListener("resize",()=>drawChart(currentWindow));
 const canvas=document.getElementById("chart"),tip=document.getElementById("tip");
 canvas.onmousemove=event=>{
  const z=canvas._chart;if(!z)return;
  const rect=canvas.getBoundingClientRect(),mx=event.clientX-rect.left;
  const index=Math.max(0,Math.min(z.data.length-1,Math.floor((mx-z.left)/z.step))),d=z.data[index];
  tip.style.display="block";
  tip.style.left=Math.min(rect.width-170,Math.max(4,mx+10))+"px";
  tip.style.top=Math.max(5,event.clientY-rect.top-55)+"px";
  tip.innerHTML=`${esc(d.date)}<br>开 ${fmt(d.open)} 高 ${fmt(d.high)} 低 ${fmt(d.low)} 收 ${fmt(d.close)}<br>涨跌 ${pct(d.pct)} · 换手 ${fmt(d.turnover)}%`;
 };
 canvas.onmouseleave=()=>{tip.style.display="none"};
 const online=/^https?:$/i.test(location.protocol),link=document.getElementById("linkAction"),share=document.getElementById("shareAction");
 link.textContent=online?"复制链接":"保存网页";
 share.textContent=online?"分享链接":"分享网页文件";
 document.getElementById("copySummary").onclick=()=>copyText(summaryText());
 link.onclick=online?()=>copyText(location.href):saveHtml;
 share.onclick=online?()=>shareLink():shareFile;
 document.getElementById("fontAction").onclick=event=>{
  document.body.classList.toggle("large");
  event.currentTarget.textContent=document.body.classList.contains("large")?"标准字":"大字";
  drawChart(currentWindow);
 };
 document.getElementById("printAction").onclick=()=>{
  try{window.print()}catch(error){notify("请在Chrome/Edge中使用 打印→另存为PDF")}
 };
}

async function copyText(text){try{await navigator.clipboard.writeText(text);notify("已复制")}catch{const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");notify("已复制")}catch{prompt("请手动复制",text)}ta.remove()}}
function htmlBlob(){return new Blob(["<!doctype html>\n"+document.documentElement.outerHTML],{type:"text/html;charset=utf-8"})}function saveHtml(){const a=document.createElement("a");a.href=URL.createObjectURL(htmlBlob());a.download=`${m.stock_code}-${m.stock_name}-eagle-eye.html`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify("已保存单文件HTML；本地文件不是公网链接")}
async function shareLink(){if(navigator.share){try{await navigator.share({title:document.title,text:summaryText(),url:location.href});return}catch{}}copyText(location.href)}async function shareFile(){const f=new File([htmlBlob()],`${m.stock_code}-${m.stock_name}-eagle-eye.html`,{type:"text/html"});if(navigator.canShare?.({files:[f]})){try{await navigator.share({title:document.title,text:"个股研究报告",files:[f]});return}catch{}}saveHtml();notify("浏览器不支持直接分享文件：已下载，请从微信文件入口发送")}
let toastTimer;function notify(text){const el=document.getElementById("toast");el.textContent=text;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2600)}
render();
